[workspace]
members = [
    "canisters/cell_manager",
    "canisters/data_cell",
    "canisters/query_aggregator",
    "canisters/atlas_mesh"
]

[workspace.dependencies]
# Core IC dependencies - optimized for performance
ic-cdk = { version = "0.13", features = ["stable-memory"] }
ic-cdk-timers = "0.7"
ic-stable-structures = { version = "0.6", features = ["btreemap"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
candid = { version = "0.10", features = ["all"] }
anyhow = { version = "1.0", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2021"

# Build optimization for cycle efficiency
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
